# .github/workflows/deploy.yml - GitHub Actions: on each push to main, test the app, publish its image, deploy it to the AWS server.
#
# GitHub Actions runs this file on GitHub's machines ("runners"). Two jobs, the second only if
# the first succeeds:
# 1. build: on an ARM runner (the server is ARM, so the image must be too), build the image,
#    run the whole test suite inside it against a Postgres + pgvector "service container", then
#    push it to GitHub's registry (GHCR) twice: tagged with the commit id and as "latest".
#    A failing test stops here: nothing is published or deployed.
# 2. deploy: log in to AWS with OIDC (GitHub's signed token, traded for one hour of the
#    github-deploy role, infra/github.tf: no AWS key is stored in GitHub), find the running
#    server by its Name tag, then use SSM Run Command to make it download
#    docker-compose.prod.yml, the Caddyfile, infra/deploy.sh and infra/backup.sh at this commit
#    and run deploy.sh with this commit's image. Finally check /health from the internet.
#    When the server is switched off (infra/server.ps1 down), the deploy is skipped with a note:
#    the image is published, and `server.ps1 up` will start from it.
#
# Needs two repository variables (Settings > Secrets and variables > Actions > Variables):
# AWS_DEPLOY_ROLE_ARN (terraform output deploy_role_arn) and SITE_URL (http://<public_ip>,
# later https://<domain>). The GHCR package must be public so the server can pull it without a
# login (once, after the first push: the package's settings > Change visibility > Public).
# Run it by hand: Actions > Deploy > Run workflow (on main).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy # one deploy at a time; a newer push waits for the running one
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write # push to GHCR with the run's own GITHUB_TOKEN
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: interview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d interview"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true # keep it on the runner for the tests; pushed below only if they pass
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the tests inside the image
        run: >
          docker run --rm --network host
          -e DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/interview
          -e LANGSMITH_TRACING=false
          ${{ env.IMAGE }}:${{ github.sha }} pytest -q

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: docker push --all-tags ${{ env.IMAGE }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the run ask GitHub for its OIDC token
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Find the server
        id: server
        run: |
          # By its Name tag: a rebuilt server (infra/server.ps1 up) gets a new id.
          instance=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=interview-prep Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId | [0]' --output text)
          if [ "$instance" = "None" ] || [ -z "$instance" ]; then
            echo "::notice::The server is switched off (infra/server.ps1 down): the image is published, nothing to deploy. 'server.ps1 up' will run this version."
            echo "running=false" >> "$GITHUB_OUTPUT"
          else
            echo "Server: $instance"
            echo "running=true" >> "$GITHUB_OUTPUT"
            echo "instance=$instance" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy on the server (SSM Run Command)
        if: steps.server.outputs.running == 'true'
        env:
          INSTANCE: ${{ steps.server.outputs.instance }}
          RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
          TAG: ${{ github.sha }}
        run: |
          params=$(jq -n --arg raw "$RAW" --arg tag "$TAG" '{commands: [
            "set -e",
            "cd /opt/interview",
            "curl -fsSL \($raw)/docker-compose.prod.yml -o docker-compose.prod.yml",
            "curl -fsSL \($raw)/Caddyfile -o Caddyfile",
            "curl -fsSL \($raw)/infra/deploy.sh -o deploy.sh",
            "curl -fsSL \($raw)/infra/backup.sh -o backup.sh",
            "chmod 700 deploy.sh backup.sh",
            "./deploy.sh \($tag)"
          ], executionTimeout: ["900"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy $TAG" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $id"
          for i in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Check /health from the internet
        if: steps.server.outputs.running == 'true'
        run: |
          for i in $(seq 1 12); do
            curl -fsS --max-time 10 "${{ vars.SITE_URL }}/health" && exit 0
            sleep 5
          done
          echo "No healthy answer from ${{ vars.SITE_URL }}/health"
          exit 1
