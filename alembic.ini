# alembic.ini - settings for Alembic, the tool that creates and changes the database tables.
#
# A "migration" is a small Python file in app/db/migrations/versions/ that changes the schema,
# e.g. "create the interviews table". Alembic records which migrations already ran, so
# `alembic upgrade head` applies only the new ones; the api container runs it on every start.
# This file only says where the migrations are. The database URL comes from DATABASE_URL
# (see app/db/migrations/env.py). New migration: docker compose exec api alembic revision -m "what"

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# URL comes from DATABASE_URL (see app/db/migrations/env.py)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
