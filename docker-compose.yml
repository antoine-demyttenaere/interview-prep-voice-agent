# docker-compose.yml - runs the whole app on your machine as two containers.
#
# - db: PostgreSQL with the pgvector extension. Stores interviews, documents, sessions and the
#   LangGraph checkpoints (saved interview progress). Data lives in the "pgdata" volume, so it
#   survives restarts (`docker compose down -v` deletes it).
# - api: the FastAPI app, built from the Dockerfile. On start it applies the database migrations
#   (alembic upgrade head), syncs the question bank (scripts/seed_question_bank.py; a failure
#   there does not block the start), then serves http://localhost:8000 (API docs at /docs).
#   Your project folder is mounted into the container and uvicorn --reload restarts the server
#   when a file in app/ or prompts/ changes, so code changes need no rebuild.
#   Rebuild (`docker compose up -d --build`) only after changing requirements.txt or the Dockerfile.
#
# Start: docker compose up -d    Logs: docker compose logs -f api    Stop: docker compose down

services:
  db:
    image: pgvector/pgvector:pg17
    # Local-only credentials, deliberately not read from the host shell
    # (host POSTGRES_* vars from other projects would leak in otherwise).
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: interview
    ports:
      - "5433:5432"  # host 5433, to avoid clashing with other local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d interview"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/interview
      # File change events don't cross the Windows bind mount; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             (python scripts/seed_question_bank.py || echo 'Question bank not seeded, starting anyway') &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir prompts"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
