# pricing.yaml - what each paid API charges, used to record the cost of every call (Phase 4.5).
#
# app/costs/pricing.py reads this file on every call (like the prompts), so a price change is a
# one-line edit here, with no restart. app/costs/usage.py multiplies these prices by what each
# call used and writes one row per call to the usage table; app/costs/budget.py adds them up
# against the budgets set in .env (BUDGET_*). The evaluations (evals/answer_scoring/run.py)
# use the same prices.
#
# Prices are in US dollars, as of November 2026. Confirm them on each provider's pricing page
# (claude.com/pricing, deepgram.com/pricing, elevenlabs.io/pricing, docs.voyageai.com/docs/pricing)
# and compare the recorded costs with each provider's dashboard: they should be within ~20%.
#
# Claude bills tokens in four kinds (the fields of response.usage):
#   input        new input tokens
#   cache_write  input written to the prompt cache (cache_creation_input_tokens)
#   cache_read   input read back from the cache (cache_read_input_tokens), much cheaper
#   output       tokens Claude writes (thinking included)
# A model is matched by the longest key that starts its id, so "claude-haiku-5-5" also covers a
# dated variant. "default" is used for any model not listed (priced high, to stay on the safe
# side) and the server logs a warning.

claude:  # dollars per million tokens
  claude-haiku-5-5:
    input: 0.10
    cache_write: 0.125
    cache_read: 0.01
    output: 0.50
    # Prompts over 100,000 input tokens (all kinds together) are billed at these prices instead:
    long_context:
      above_tokens: 100000
      input: 0.50
      cache_write: 0.625
      cache_read: 0.05
      output: 2.50
  claude-sonnet-5-5:
    input: 2.00
    cache_write: 2.50
    cache_read: 0.10
    output: 10.00
  claude-sonnet-5:
    input: 2.00
    cache_write: 2.50
    cache_read: 0.20
    output: 10.00
  default:
    input: 4.00
    cache_write: 5.00
    cache_read: 0.40
    output: 20.00

deepgram:  # speech-to-text, dollars per minute of audio (pre-recorded, pay as you go)
  nova-3: 0.0043
  default: 0.0043

elevenlabs:  # text-to-speech, dollars per 1,000 characters sent
  eleven_flash_v2_5: 0.05
  default: 0.10

voyage:  # embeddings, dollars per million tokens (the first 200M are free, but they are counted here)
  voyage-4: 0.06
  default: 0.12
